<!DOCTYPE html>
<html>
    <head>
        <title>1.地図タイルを背景として表示する</title>
        <!-- LeafletのCSS読み込み -->
        <link
            rel="stylesheet"
            href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css"
            integrity="sha512-xodZBNTC5n17Xt2atTPuE1HxjVMSvLVW9ocqUKLsCC5CXdbqCmblAshOMAS6/keqq/sMZMZ19scR4PsZChSR7A=="
            crossorigin=""
        />
        <!-- LeafletのJavaScript読み込み -->
        <script
            src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"
            integrity="sha512-XQoYMqMTK8LvdxXYG3nZ448hOEQiglfqkJs1NOQV44cWnUrBc8PkAOcXy20w0vlaXaVUearIOBhiXZ5V3ynxwA=="
            crossorigin=""
        ></script>

         <!-- Leaflet.markerclusterを読み込み -->
        <script src="https://unpkg.com/leaflet.markercluster@1.3.0/dist/leaflet.markercluster.js"></script>
        <link
            rel="stylesheet"
            href="https://unpkg.com/leaflet.markercluster@1.3.0/dist/MarkerCluster.css"
        />
        <link
            rel="stylesheet"
            href="https://unpkg.com/leaflet.markercluster@1.3.0/dist/MarkerCluster.Default.css"
        />

        <!-- KML用のJavaScript を読み込み -->
        <script src="./L.KML.js"></script>

        <!-- 雨雲レイヤーのJavaScript/CSS読み込み -->
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/mwasil/Leaflet.Rainviewer/leaflet.rainviewer.css"/>
        <script src="https://cdn.jsdelivr.net/gh/mwasil/Leaflet.Rainviewer/leaflet.rainviewer.js"></script>

    </head>
    <body>
        <!-- 地図を表示するdiv要素を宣言 -->
        <div id="map" style="height: 80vh"></div>
        <script>
            // 地図インスタンスを初期化
            const map = L.map('map', {
                center: [34.58, 135.5], // 初期表示の地図中心の[緯度, 経度]
                zoom: 13, // 初期ズームレベル
            });

            L.control.scale().addTo(map);

            // 背景レイヤーインスタンスを初期化
            const backgroundLayer = L.tileLayer(
                'https://tile.openstreetmap.org/{z}/{x}/{y}.png', // OSMのURLテンプレート
                {
                    maxZoom: 19,
                    attribution: '&copy; <a href="http://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
                },
            );
            // 地図インスタンスへレイヤーを追加
            map.addLayer(backgroundLayer);

            const chiriinLayer = L.tileLayer(
                'https://cyberjapandata.gsi.go.jp/xyz/std/{z}/{x}/{y}.png', 
                {
                    maxZoom: 18,
                },
            );
            map.addLayer(chiriinLayer);

            L.control.layers({
                "OpenStreetMap": backgroundLayer,
                "地理院地図（標準）":chiriinLayer
            }).addTo(map);

            const nakamozu_marker = L.marker([34.544865, 135.506274]);
            nakamozu_marker.bindPopup('なかもずキャンパスC棟');
            map.addLayer(nakamozu_marker);

            L.marker([34.592331, 135.505276]).bindPopup('杉本キャンパス').addTo(map);

            map.attributionControl.addAttribution(
                '<a href="https://nlftp.mlit.go.jp/ksj/gml/datalist/KsjTmplt-P29-v2_0.html">国土数値情報-学校データ</a>',
            );

            fetch('./P29-21_27.geojson')
                .then((res) => res.json())
                .then((json) => {
                    L.geoJSON(json)
                        .bindPopup((layer) => layer.feature.properties.P29_004)
                        .addTo(map);
                });

                fetch('./P29-21.geojson') // 全国分の学校データ（5万件超）のGeoJSONを非同期読み込み
                     .then((res) => res.json())
                     .then((json) => {
                        // クラスタリングレイヤーを作成し地図に追加
                        const markers = L.markerClusterGroup()
                            .bindPopup(
                                (layer) => layer.feature.properties.P29_004, // ポップアップで学校名を表示
                            )
                            .addTo(map);
                        L.geoJSON(json).addTo(markers); // クラスタリングレイヤーにGeoJSONデータをセット
                    });
    
                    // KMLレイヤーを作成
                    fetch("./niigata_route.kml") 
                        .then(res => res.text())
                            .then(kmltext => {
                                // 新しいKMLレイヤをオーバーレイ
                                const parser = new DOMParser();
                                const kml = parser.parseFromString(kmltext, 'text/xml');
                                const track = new L.KML(kml);
                                map.addLayer(track);

                                // 地図をKMLに合うように調整
                                const bounds = track.getBounds();
                                map.fitBounds(bounds);  
                    });

            var LayerControl = L.control.layers({
            "地理院地図（標準）": chiriinLayer,
            "OpenStreetMap": backgroundLayer
            }).addTo(map);

                         // GeoJSONレイヤーを作成
            fetch("./P29-21_27.geojson") // 学校データのGeoJSONを非同期読み込み
                .then((response) => response.json())
                .then((data) => {
                const markers = L.geoJSON(data)
                    .bindPopup((layer) => layer.feature.properties.P29_004) // ポップアップで学校名を表示
                    .addTo(map);
                    // チェックボックス
                    LayerControl.addOverlay(markers, "学校")
                    
            });

            // ラインレイヤーを作成
            fetch("./line.geojson") // ルートデータの非同期読み込み
                .then((response) => response.json())
                .then((data) => {
                var line = L.geoJSON(data, {
                    "color": "#FF00FF",
                    "weight": 6,
                    "opacity": 0.65
                })
                    map.addLayer(line)
                    LayerControl.addOverlay(line, "ルート")
            });

            // 雨雲レイヤーを追加
            L.control.rainviewer({ 
	            position: 'bottomleft',
	            nextButtonText: '>',
	            playStopButtonText: 'Play/Stop',
	            prevButtonText: '<',
	            positionSliderLabelText: "Hour:",
	            opacitySliderLabelText: "Opacity:",
	            animationInterval: 500,
	            opacity: 0.5
            }).addTo(map);

                        // 行政区域レイヤーを作成
            fetch("./N03-21_12_210101.geojson") // 行政区域データを非同期読み込み
                .then((response) => response.json())
                .then((data) => {
                    // 特定の値によりGeoJSONをフィルタリング
                    var filteredData = data.features.filter(feature => feature.properties.N03_003 === '習志野市');
                    var selected_area = L.geoJSON(filteredData)
                        .bindPopup((layer) => layer.feature.properties.N03_004) // ポップアップで表示
                    map.addLayer(selected_area)
                    // チェックボックス
                    LayerControl.addOverlay(selected_area, "行政区域")
                    // GeoJSONレイヤに地図がフィットするように表示範囲を自動調整
                    map.fitBounds(selected_area.getBounds());
            });

            // ローカルPC上のOSRMサーバで杉本キャンパスからなかもずキャンパスまでのルートを検索するURL
            const url = 'https://routing.openstreetmap.de/routed-car/route/v1/driving/135.505276,34.592331;135.506274,34.544865?geometries=geojson&overview=full'

            async function addRouteLayer(){
            const response = await fetch(url);
            const json = await response.json();
            routeLayer = L.geoJSON(json['routes'][0]['geometry'],{
                "color": "#FF00FF",
                "weight": 6,                    
                "opacity": 0.65
            });                            
            routeLayer.addTo(map);
      
             // 地図をルートに合うように調整
            const bounds = routeLayer.getBounds();
            map.fitBounds(bounds); 
      
            }
            // 地図にルートを追加
            addRouteLayer();

           fetch("./N03-21_12_210101.geojson")
            .then(res => res.json())
            .then(data => {

            // 堺市中区だけ抽出
            const naka = data.features.filter(f =>
            f.properties.N03_003 === "習志野市"
             );

            const nakaLayer = L.geoJSON(naka, {
            style: {
                color: "#ff0000",       // 枠線 真っ赤
                weight: 5,              // 枠線 太め
                fillColor: "#ff0000",   // 塗りも赤
                fillOpacity: 0.25       // 半透明（ここ調整）
            }
            }).bindPopup("習志野市");

            nakaLayer.addTo(map);
            nakaLayer.bringToFront();   // ← 超重要
            map.fitBounds(nakaLayer.getBounds());

            LayerControl.addOverlay(nakaLayer, "習志野市");
        });


        </script>
    </body>
</html>
